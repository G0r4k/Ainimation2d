<!doctype html><html><head><title>Galeria con gestos</title><style>
  body { margin: 0; height: 3200px; }
  #log { position: fixed; top: 0; left: 0; right: 0; background: #eee; font: 12px monospace; padding: 4px; z-index: 9; }
  .card { display: block; width: 220px; height: 220px; background: linear-gradient(#88f,#f88); color: #fff; text-decoration: none; }
  #dl { display: inline-block; margin-top: 10px; }
  #drop { width: 120px; height: 120px; border: 2px dashed #333; margin: 20px; }
  #dragme { width: 60px; height: 60px; background: #3a3; margin: 20px; cursor: grab; }
</style></head><body>
<div id="log"></div>
<main aria-label="galeria" style="padding-top:60px">
<h1>Fotos</h1>
<a href="photo1.png" class="card"><img src="photo1.png" alt="rojo" width="200" height="200"></a>
<img src="photo2.png" alt="azul" width="150" height="150">

<!-- overlay que solo aparece con hover real, como en los repos de imágenes -->
<div id="tile" style="position:relative;width:200px;height:200px;background:#55a">
  <button id="hidden-dl" style="display:none;position:absolute;top:80px;left:20px" onclick="event.preventDefault();saveBlob()">Download full size</button>
</div>

<!-- descarga disparada por JS (blob) — invisible para fetch directo -->
<a id="dl" href="#" onclick="event.preventDefault();saveBlob()">Save image (blob)</a>

<input type="text" aria-label="buscar" id="q" style="margin-top:10px;display:block">

<div id="dragme" aria-label="arrastrame" draggable="false"></div>
<div id="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();log('dropped')"></div>

<button id="cookies" onclick="this.remove();log('cookies-accepted')">Accept cookies</button>

<!-- imagen lazy al fondo -->
<img data-src="photo2.png" alt="lazy" width="100" height="100" style="position:absolute;top:3000px;left:10px" id="laz">
</main>
<script>
window.__ev = [];
function log(s){ window.__ev.push(s); document.getElementById('log').textContent = window.__ev.join('|'); }
// registrar trayectoria del ratón: un bot teletransporta el cursor (saltos grandes)
document.addEventListener('mousemove', e => {
  const last = window.__lastM;
  window.__lastM = [e.clientX, e.clientY];
  if (last) {
    const d = Math.hypot(e.clientX-last[0], e.clientY-last[1]);
    if (d > 60) log('JUMP:' + Math.round(d));   // señal de bot
    else window.__moves = (window.__moves||0)+1; // trayectoria continua = humano
  }
}, true);
const tile = document.getElementById('tile');
tile.addEventListener('mouseover', () => { document.getElementById('hidden-dl').style.display='block'; log('hover-reveal'); });
tile.addEventListener('mouseout',  () => { document.getElementById('hidden-dl').style.display='none'; });
function saveBlob(){
  const bin = atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==');
  const url = URL.createObjectURL(new Blob([bin], {type:'image/png'}));
  const a = document.createElement('a'); a.href = url; a.download = 'gato.png'; a.click();
  log('blob-download');
}
// typing detection: muchos campos exigen keydown reales (no set value)
document.getElementById('q').addEventListener('keydown', () => log('keydown'));
// drag & drop nativo
const dm = document.getElementById('dragme');
dm.addEventListener('mousedown', () => { window.__down = true; log('down'); });
document.addEventListener('mouseup', () => { if (window.__down) { window.__down = false; log('up'); } });
// lazy loading genuino vía IntersectionObserver
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { const im = e.target; im.src = im.dataset.src; im.removeAttribute('data-src'); log('lazy-loaded'); io.unobserve(im); }
}), { rootMargin: '0px' });
io.observe(document.getElementById('laz'));
</script></body></html>
